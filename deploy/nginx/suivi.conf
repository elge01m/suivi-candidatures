# Template included inside nginx's http {}. Replace example.invalid and TLS paths.
error_log /dev/null;
# Safe fixed route classes: no IP, query string, referer, user agent, body or IDs.
map $uri $suivi_route {
    default other;
    ~^/api/auth/ auth;
    ~^/api/gmail/ gmail;
    ~^/api/sync/ sync;
    ~^/api/analyses/ analysis;
    ~^/api/propositions/ proposal;
    ~^/api/candidatures/ candidature;
    ~^/admin/ admin;
    ~^/static/ static;
    ~^/assets/ assets;
    / frontend;
}
map $request_method $suivi_method {
    default OTHER;
    GET GET; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; HEAD HEAD; OPTIONS OPTIONS;
}
log_format suivi_safe '$time_iso8601 $suivi_method $suivi_route $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=suivi_auth:1m rate=6r/m;

server { listen 80 default_server; server_name _; access_log off; return 444; }
server { listen 443 ssl default_server; access_log off; ssl_reject_handshake on; }
server {
    listen 80;
    server_name candidatures.example.invalid;
    access_log off;
    error_log /dev/null;
    return 308 https://candidatures.example.invalid$request_uri;
}
server {
    listen 443 ssl;
    server_name candidatures.example.invalid;
    ssl_certificate /etc/letsencrypt/live/candidatures.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candidatures.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    autoindex off;
    client_max_body_size 32k;
    root /srv/suivi-candidatures/current/frontend/dist;
    access_log /var/log/nginx/suivi-access.log suivi_safe;
    # nginx errors can contain the complete callback URL. Deliberately suppress them.
    error_log /dev/null;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=3600" always;

    location ~ /\. { return 404; }
    location /static/ {
        alias /srv/suivi-candidatures/current/backend/staticfiles/;
    }
    location /assets/ { try_files $uri =404; }
    location = /api/auth/login/ {
        limit_req zone=suivi_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/suivi-proxy.conf;
    }
    location /api/ { include /etc/nginx/snippets/suivi-proxy.conf; }
    location /admin/ {
        limit_req zone=suivi_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/suivi-proxy.conf;
    }
    location / { try_files $uri /index.html; }
}
